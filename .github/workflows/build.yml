name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/G350ConnectionManager/G350ConnectionManager.csproj

      - name: Build
        run: dotnet build src/G350ConnectionManager/G350ConnectionManager.csproj -c Release --no-restore

      - name: Publish single-file EXE
        run: dotnet publish src/G350ConnectionManager/G350ConnectionManager.csproj -c Release

      - name: Collect artifact
        shell: pwsh
        run: |
          $src = "src/G350ConnectionManager/bin/Release/net8.0-windows/win-x64/publish/G350ConnectionManager.exe"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $src out/G350ConnectionManager.exe
          Get-Item out/G350ConnectionManager.exe | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: G350ConnectionManager-win-x64
          path: out/G350ConnectionManager.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/G350ConnectionManager.exe
          generate_release_notes: false
