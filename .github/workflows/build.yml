name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # `publish` performs its own restore for the Release + win-x64 target,
      # which downloads the runtime packs a self-contained build needs. Doing
      # a separate `restore`/`build` first (framework-dependent) leaves the
      # assets file without the win-x64 target and fails with NETSDK1047/1112.
      - name: Publish single-file EXE
        run: >
          dotnet publish src/G350ConnectionManager/G350ConnectionManager.csproj
          -c Release
          -o out

      - name: Verify artifact
        shell: pwsh
        run: |
          $exe = "out/G350ConnectionManager.exe"
          if (-not (Test-Path $exe)) { throw "EXE not produced" }
          $item = Get-Item $exe
          "{0}  {1:N1} MB" -f $item.Name, ($item.Length / 1MB)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: G350ConnectionManager-win-x64
          path: out/G350ConnectionManager.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/G350ConnectionManager.exe
          generate_release_notes: false
